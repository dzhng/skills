<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="'SF Pro Display','SF Pro Text',-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcfcfb"/>
      <stop offset="55%" stop-color="#f8f8f6"/>
      <stop offset="100%" stop-color="#f2f2ef"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3d2c"/>
      <stop offset="100%" stop-color="#12261b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1d3a26" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a68f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a8a52"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86ad8f"/>
    </marker>
  </defs>

  <rect width="1400" height="620" fill="url(#bg)"/>

  <!-- header -->
  <text x="56" y="62" font-size="30" font-weight="700" fill="#13241a">The full loop — one growing season</text>
  <text x="56" y="94" font-size="16.5" fill="#56665a">One big feature, seed to harvest. Your time is in the bookends — planting and curating. The middle grows on its own.</text>

  <!-- connectors between cards -->
  <line x1="358" y1="285" x2="374" y2="285" stroke="#94a68f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="285" x2="646" y2="285" stroke="#94a68f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1024" y1="285" x2="1040" y2="285" stroke="#94a68f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CARD 1 -->
  <g filter="url(#shadow)">
    <rect x="56" y="150" width="300" height="270" rx="18" fill="#ffffff" stroke="#dfe8d8"/>
  </g>
  <rect x="56" y="150" width="300" height="5" rx="2.5" fill="#4f8ad8"/>
  <circle cx="88" cy="192" r="14" fill="#e8f0fb"/>
  <text x="88" y="197" font-size="14" font-weight="700" fill="#3b6fc0" text-anchor="middle">1</text>
  <text x="112" y="197" font-size="15" font-weight="600" fill="#3b6fc0" font-family="'SF Mono',Menlo,monospace">/explore-unknowns</text>
  <text x="88" y="242" font-size="21" font-weight="700" fill="#13241a">Survey the land</text>
  <text x="88" y="274" font-size="15" fill="#56665a">Quadrant-by-quadrant interview.</text>
  <text x="88" y="298" font-size="15" fill="#56665a">It hands you rendered options</text>
  <text x="88" y="322" font-size="15" fill="#56665a">and mocks to react to, until</text>
  <text x="88" y="346" font-size="15" fill="#56665a">the fog shows what to plant.</text>
  <rect x="88" y="368" width="146" height="26" rx="13" fill="#eef4ea"/>
  <text x="102" y="385" font-size="12.5" font-weight="600" fill="#4a5f4e">you choose the seeds</text>

  <!-- CARD 2 -->
  <g filter="url(#shadow)">
    <rect x="378" y="150" width="250" height="270" rx="18" fill="#ffffff" stroke="#dfe8d8"/>
  </g>
  <rect x="378" y="150" width="250" height="5" rx="2.5" fill="#c9962b"/>
  <circle cx="410" cy="192" r="14" fill="#f8f0dc"/>
  <text x="410" y="197" font-size="14" font-weight="700" fill="#a8771a" text-anchor="middle">2</text>
  <text x="434" y="197" font-size="15" font-weight="600" fill="#a8771a" font-family="'SF Mono',Menlo,monospace">/write-spec</text>
  <text x="410" y="242" font-size="21" font-weight="700" fill="#13241a">Lay out the plots</text>
  <text x="410" y="274" font-size="15" fill="#56665a">Transcribes the map into</text>
  <text x="410" y="298" font-size="15" fill="#56665a">plots that grow and verify</text>
  <text x="410" y="322" font-size="15" fill="#56665a">on their own. The choices</text>
  <text x="410" y="346" font-size="15" fill="#56665a">were made upstream.</text>
  <rect x="410" y="368" width="176" height="26" rx="13" fill="#eef4ea"/>
  <text x="424" y="385" font-size="12.5" font-weight="600" fill="#4a5f4e">you don't read the spec</text>

  <!-- CARD 3 (dark, the machine) -->
  <g filter="url(#shadow)">
    <rect x="650" y="150" width="372" height="270" rx="18" fill="url(#dark)"/>
  </g>
  <rect x="650" y="150" width="372" height="5" rx="2.5" fill="#3a8a52"/>
  <circle cx="682" cy="192" r="14" fill="#2c5038"/>
  <text x="682" y="197" font-size="14" font-weight="700" fill="#9fdcae" text-anchor="middle">3</text>
  <text x="706" y="197" font-size="15" font-weight="600" fill="#9fdcae" font-family="'SF Mono',Menlo,monospace">/goal /implement-spec</text>
  <text x="682" y="242" font-size="21" font-weight="700" fill="#ffffff">Let it grow</text>
  <text x="682" y="274" font-size="15" fill="#bcd4c2">Loop mode in Claude Code or Codex.</text>
  <text x="682" y="298" font-size="15" fill="#bcd4c2">Agents tend every plot until it ripens,</text>
  <text x="682" y="322" font-size="15" fill="#bcd4c2">and re-plot the field when the ground</text>
  <text x="682" y="346" font-size="15" fill="#bcd4c2">proves the plan stale.</text>
  <!-- inner loop pills -->
  <rect x="682" y="366" width="82" height="28" rx="14" fill="#2a4a35"/>
  <text x="723" y="384.5" font-size="12.5" font-weight="600" fill="#d2e6d6" text-anchor="middle">slice</text>
  <line x1="770" y1="380" x2="784" y2="380" stroke="#86ad8f" stroke-width="1.6" marker-end="url(#arrowWhite)"/>
  <rect x="790" y="366" width="78" height="28" rx="14" fill="#2a4a35"/>
  <text x="829" y="384.5" font-size="12.5" font-weight="600" fill="#d2e6d6" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">/review</text>
  <line x1="874" y1="380" x2="888" y2="380" stroke="#86ad8f" stroke-width="1.6" marker-end="url(#arrowWhite)"/>
  <rect x="894" y="366" width="112" height="28" rx="14" fill="#2a4a35"/>
  <text x="950" y="384.5" font-size="12.5" font-weight="600" fill="#d2e6d6" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">decisions.md</text>
  <path d="M950 396 L950 406 Q950 412 942 412 L731 412 Q723 412 723 406 L723 398" fill="none" stroke="#7aa585" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowWhite)"/>

  <!-- CARD 4 -->
  <g filter="url(#shadow)">
    <rect x="1044" y="150" width="300" height="270" rx="18" fill="#ffffff" stroke="#dfe8d8"/>
  </g>
  <rect x="1044" y="150" width="300" height="5" rx="2.5" fill="#c8643c"/>
  <circle cx="1076" cy="192" r="14" fill="#fbeae2"/>
  <text x="1076" y="197" font-size="14" font-weight="700" fill="#b0532e" text-anchor="middle">4</text>
  <text x="1100" y="197" font-size="15" font-weight="600" fill="#b0532e" font-family="'SF Mono',Menlo,monospace">decisions.md</text>
  <text x="1076" y="242" font-size="21" font-weight="700" fill="#13241a">Weed and prune</text>
  <text x="1076" y="274" font-size="15" fill="#56665a">Not the diff: every call made</text>
  <text x="1076" y="298" font-size="15" fill="#56665a">where the spec was silent,</text>
  <text x="1076" y="322" font-size="15" fill="#56665a">least-confident first. Pull</text>
  <text x="1076" y="346" font-size="15" fill="#56665a">the weeds, cut back sprawl.</text>
  <rect x="1076" y="368" width="198" height="26" rx="13" fill="#eef4ea"/>
  <text x="1090" y="385" font-size="12.5" font-weight="600" fill="#4a5f4e">this is the curation surface</text>

  <!-- feedback arrow 4 -> 3 -->
  <path d="M1194 424 L1194 456 Q1194 468 1182 468 L848 468 Q836 468 836 456 L836 428" fill="none" stroke="#3a8a52" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowBlue)"/>
  <rect x="896" y="454" width="242" height="28" rx="14" fill="#e3f1e5"/>
  <text x="1017" y="472.5" font-size="13" font-weight="600" fill="#3a8a52" text-anchor="middle">cut it back → regrow → re-audit</text>

  <!-- time band -->
  <path d="M56 512 L56 528 L628 528 L628 512" fill="none" stroke="#adbfa8" stroke-width="2"/>
  <path d="M650 512 L650 528 L1022 528 L1022 512" fill="none" stroke="#adbfa8" stroke-width="2"/>
  <path d="M1044 512 L1044 528 L1344 528 L1344 512" fill="none" stroke="#adbfa8" stroke-width="2"/>

  <text x="342" y="558" font-size="15" font-weight="700" fill="#13241a" text-anchor="middle">30 min – 3 hrs</text>
  <text x="342" y="580" font-size="13.5" fill="#56665a" text-anchor="middle">attended · planting</text>
  <text x="836" y="558" font-size="15" font-weight="700" fill="#13241a" text-anchor="middle">hours → 2–3 days</text>
  <text x="836" y="580" font-size="13.5" fill="#56665a" text-anchor="middle">unattended · it grows on its own</text>
  <text x="1194" y="558" font-size="15" font-weight="700" fill="#13241a" text-anchor="middle">30 min – 3 hrs</text>
  <text x="1194" y="580" font-size="13.5" fill="#56665a" text-anchor="middle">attended · curating</text>
</svg>
