<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="'SF Pro Display','SF Pro Text',-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f5fd"/>
      <stop offset="55%" stop-color="#e6ecfb"/>
      <stop offset="100%" stop-color="#d8e2fb"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18224c"/>
      <stop offset="100%" stop-color="#0e1533"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a2a63" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e9ab8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b52f5"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8ec4"/>
    </marker>
  </defs>

  <rect width="1400" height="620" fill="url(#bg)"/>

  <!-- header -->
  <text x="56" y="62" font-size="30" font-weight="700" fill="#0f1839">The full loop</text>
  <text x="56" y="94" font-size="16.5" fill="#5b6684">One big feature, start to finish. Your time is in the bookends — the middle runs itself.</text>

  <!-- connectors between cards -->
  <line x1="358" y1="285" x2="374" y2="285" stroke="#8e9ab8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="285" x2="646" y2="285" stroke="#8e9ab8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1024" y1="285" x2="1040" y2="285" stroke="#8e9ab8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CARD 1 -->
  <g filter="url(#shadow)">
    <rect x="56" y="150" width="300" height="270" rx="18" fill="#ffffff" stroke="#dde5f7"/>
  </g>
  <rect x="56" y="150" width="300" height="5" rx="2.5" fill="#5b8def"/>
  <circle cx="88" cy="192" r="14" fill="#eaf0ff"/>
  <text x="88" y="197" font-size="14" font-weight="700" fill="#2b52f5" text-anchor="middle">1</text>
  <text x="112" y="197" font-size="15" font-weight="600" fill="#2b52f5" font-family="'SF Mono',Menlo,monospace">/explore-unknowns</text>
  <text x="88" y="242" font-size="21" font-weight="700" fill="#0f1839">Map the fog</text>
  <text x="88" y="274" font-size="15" fill="#5b6684">Quadrant-by-quadrant interview.</text>
  <text x="88" y="298" font-size="15" fill="#5b6684">It hands you rendered options</text>
  <text x="88" y="322" font-size="15" fill="#5b6684">and mocks to react to instead</text>
  <text x="88" y="346" font-size="15" fill="#5b6684">of asking you to imagine.</text>
  <rect x="88" y="368" width="150" height="26" rx="13" fill="#f1f5ff"/>
  <text x="102" y="385" font-size="12.5" font-weight="600" fill="#4b5b87">you answer · you decide</text>

  <!-- CARD 2 -->
  <g filter="url(#shadow)">
    <rect x="378" y="150" width="250" height="270" rx="18" fill="#ffffff" stroke="#dde5f7"/>
  </g>
  <rect x="378" y="150" width="250" height="5" rx="2.5" fill="#7a6bd8"/>
  <circle cx="410" cy="192" r="14" fill="#f1eeff"/>
  <text x="410" y="197" font-size="14" font-weight="700" fill="#6a58d0" text-anchor="middle">2</text>
  <text x="434" y="197" font-size="15" font-weight="600" fill="#6a58d0" font-family="'SF Mono',Menlo,monospace">/write-spec</text>
  <text x="410" y="242" font-size="21" font-weight="700" fill="#0f1839">Codify</text>
  <text x="410" y="274" font-size="15" fill="#5b6684">Transcribes the map into</text>
  <text x="410" y="298" font-size="15" fill="#5b6684">independently verifiable</text>
  <text x="410" y="322" font-size="15" fill="#5b6684">slices. The decisions were</text>
  <text x="410" y="346" font-size="15" fill="#5b6684">already made upstream.</text>
  <rect x="410" y="368" width="176" height="26" rx="13" fill="#f1f5ff"/>
  <text x="424" y="385" font-size="12.5" font-weight="600" fill="#4b5b87">you don't read the spec</text>

  <!-- CARD 3 (dark, the machine) -->
  <g filter="url(#shadow)">
    <rect x="650" y="150" width="372" height="270" rx="18" fill="url(#dark)"/>
  </g>
  <rect x="650" y="150" width="372" height="5" rx="2.5" fill="#2b52f5"/>
  <circle cx="682" cy="192" r="14" fill="#26326a"/>
  <text x="682" y="197" font-size="14" font-weight="700" fill="#8fa8ff" text-anchor="middle">3</text>
  <text x="706" y="197" font-size="15" font-weight="600" fill="#8fa8ff" font-family="'SF Mono',Menlo,monospace">/goal /implement-spec</text>
  <text x="682" y="242" font-size="21" font-weight="700" fill="#ffffff">Build</text>
  <text x="682" y="274" font-size="15" fill="#b9c4e6">Loop mode in Claude Code or Codex.</text>
  <text x="682" y="298" font-size="15" fill="#b9c4e6">Runs until every TODO is closed, and</text>
  <text x="682" y="322" font-size="15" fill="#b9c4e6">re-slices the plan when the code</text>
  <text x="682" y="346" font-size="15" fill="#b9c4e6">proves it stale.</text>
  <!-- inner loop pills -->
  <rect x="682" y="366" width="82" height="28" rx="14" fill="#232f63"/>
  <text x="723" y="384.5" font-size="12.5" font-weight="600" fill="#c6d1f2" text-anchor="middle">slice</text>
  <line x1="770" y1="380" x2="784" y2="380" stroke="#7f8ec4" stroke-width="1.6" marker-end="url(#arrowWhite)"/>
  <rect x="790" y="366" width="78" height="28" rx="14" fill="#232f63"/>
  <text x="829" y="384.5" font-size="12.5" font-weight="600" fill="#c6d1f2" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">/review</text>
  <line x1="874" y1="380" x2="888" y2="380" stroke="#7f8ec4" stroke-width="1.6" marker-end="url(#arrowWhite)"/>
  <rect x="894" y="366" width="112" height="28" rx="14" fill="#232f63"/>
  <text x="950" y="384.5" font-size="12.5" font-weight="600" fill="#c6d1f2" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">decisions.md</text>
  <path d="M950 396 L950 406 Q950 412 942 412 L731 412 Q723 412 723 406 L723 398" fill="none" stroke="#6b7ab8" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowWhite)"/>

  <!-- CARD 4 -->
  <g filter="url(#shadow)">
    <rect x="1044" y="150" width="300" height="270" rx="18" fill="#ffffff" stroke="#dde5f7"/>
  </g>
  <rect x="1044" y="150" width="300" height="5" rx="2.5" fill="#2f9e6e"/>
  <circle cx="1076" cy="192" r="14" fill="#e8f7f0"/>
  <text x="1076" y="197" font-size="14" font-weight="700" fill="#22815a" text-anchor="middle">4</text>
  <text x="1100" y="197" font-size="15" font-weight="600" fill="#22815a" font-family="'SF Mono',Menlo,monospace">decisions.md</text>
  <text x="1076" y="242" font-size="21" font-weight="700" fill="#0f1839">Review the decisions</text>
  <text x="1076" y="274" font-size="15" fill="#5b6684">Not the diff. Every decision</text>
  <text x="1076" y="298" font-size="15" fill="#5b6684">made where the spec was</text>
  <text x="1076" y="322" font-size="15" fill="#5b6684">silent, ranked least-confident</text>
  <text x="1076" y="346" font-size="15" fill="#5b6684">first — you own them now.</text>
  <rect x="1076" y="368" width="196" height="26" rx="13" fill="#f1f5ff"/>
  <text x="1090" y="385" font-size="12.5" font-weight="600" fill="#4b5b87">this is the review surface</text>

  <!-- feedback arrow 4 -> 3 -->
  <path d="M1194 424 L1194 456 Q1194 468 1182 468 L848 468 Q836 468 836 456 L836 428" fill="none" stroke="#2b52f5" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowBlue)"/>
  <rect x="906" y="454" width="222" height="28" rx="14" fill="#e7edff"/>
  <text x="1017" y="472.5" font-size="13" font-weight="600" fill="#2b52f5" text-anchor="middle">send changes back → re-audit</text>

  <!-- time band -->
  <path d="M56 512 L56 528 L628 528 L628 512" fill="none" stroke="#a9b5d4" stroke-width="2"/>
  <path d="M650 512 L650 528 L1022 528 L1022 512" fill="none" stroke="#a9b5d4" stroke-width="2"/>
  <path d="M1044 512 L1044 528 L1344 528 L1344 512" fill="none" stroke="#a9b5d4" stroke-width="2"/>

  <text x="342" y="558" font-size="15" font-weight="700" fill="#0f1839" text-anchor="middle">30 min – 3 hrs</text>
  <text x="342" y="580" font-size="13.5" fill="#5b6684" text-anchor="middle">attended · planning</text>
  <text x="836" y="558" font-size="15" font-weight="700" fill="#0f1839" text-anchor="middle">hours → 2–3 days</text>
  <text x="836" y="580" font-size="13.5" fill="#5b6684" text-anchor="middle">unattended · you walk away</text>
  <text x="1194" y="558" font-size="15" font-weight="700" fill="#0f1839" text-anchor="middle">30 min – 3 hrs</text>
  <text x="1194" y="580" font-size="13.5" fill="#5b6684" text-anchor="middle">attended · reviewing decisions</text>
</svg>
